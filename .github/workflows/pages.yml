name: Deploy P2 Update Site to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-site:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download & Extract DBeaver CE Libraries
        run: |
          mkdir -p .dbeaver-lib
          echo "Downloading latest DBeaver CE deb..."
          curl -sSL "https://dbeaver.io/files/dbeaver-ce_latest_amd64.deb" -o dbeaver.deb
          dpkg-deb -x dbeaver.deb .dbeaver-lib
          mv .dbeaver-lib/usr/share/dbeaver-ce/plugins .dbeaver-lib/plugins

      - name: Build Eclipse P2 Update Site
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-update-site.sh

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
